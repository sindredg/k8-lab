# Attaches the SSL policy to the Gateway. Without this the load balancer runs
# Google's default, which accepts TLS 1.0 and 1.1.
#
# The policy itself is Terraform's, in modules/gateway. This names it, the way
# the Gateway names the certificate map rather than carrying key material.
apiVersion: networking.gke.io/v1
kind: GCPGatewayPolicy
metadata:
  name: external
  namespace: demo
  labels:
    app.kubernetes.io/part-of: k8-lab
spec:
  default:
    sslPolicy: k8-lab-gateway-ssl-policy

  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: external
