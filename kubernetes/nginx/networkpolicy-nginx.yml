# Allows labelled clients in the namespace to reach the NGINX Pods on the HTTP port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nginx-allow-http
  namespace: demo
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/part-of: k8-lab
spec:
  # This policy governs traffic arriving at the NGINX Pods.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nginx

  policyTypes:
    - Ingress

  ingress:
    # A podSelector with no namespaceSelector beside it means this namespace only.
    - from:
        - podSelector:
            matchLabels:
              nginx-client: "true"

      # The container port, not the Service port, because policy is enforced on the Pod.
      ports:
        - protocol: TCP
          port: 80
---
# Allows those same clients to open the connection, which their own default deny egress blocks.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nginx-client-allow-egress
  namespace: demo
  labels:
    app.kubernetes.io/part-of: k8-lab
spec:
  # This policy governs traffic leaving the client Pods.
  podSelector:
    matchLabels:
      nginx-client: "true"

  policyTypes:
    - Egress

  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nginx
      ports:
        - protocol: TCP
          port: 80
