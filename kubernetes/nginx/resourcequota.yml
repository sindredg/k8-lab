# Caps the total resources every Pod in the namespace can reserve and consume.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: demo-budget
  namespace: demo
  labels:
    app.kubernetes.io/part-of: k8-lab
spec:
  hard:
    # Sized for the worst moment of a deploy at sky's HPA maximum of eight.

    # Reserved capacity the scheduler counts: 11 sky, 4 nginx, 1 smoke Pod.
    requests.cpu: "5"
    requests.memory: 2Gi

    # Burst ceiling. Too low stalls a rollout rather than failing it.
    limits.cpu: "13"
    limits.memory: 4Gi

    # Object count, independent of size: 11 sky, 4 nginx, 1 smoke Pod.
    pods: "16"
