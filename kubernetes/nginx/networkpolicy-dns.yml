# Restores cluster DNS for every Pod in the namespace, which the default deny removed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: demo
  labels:
    app.kubernetes.io/part-of: k8-lab
spec:
  podSelector: {}

  policyTypes:
    - Egress

  egress:
    # NodeLocal DNSCache answers first and kube-dns answers when the cache is
    # bypassed, so both have to be allowed. They carry different k8s-app values,
    # which matchLabels cannot express on its own.
    #
    # The kube-dns Service address cannot be used here. The dataplane rewrites a
    # Service IP to a backend Pod before policy is evaluated, so a rule naming
    # that address never matches anything.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchExpressions:
              - key: k8s-app
                operator: In
                values:
                  - kube-dns
                  - node-local-dns

      # DNS answers that do not fit in a UDP packet are retried over TCP.
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
