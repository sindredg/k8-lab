# Defaults for containers that declare none, so a quota cannot reject them.
apiVersion: v1
kind: LimitRange
metadata:
  name: demo-defaults
  namespace: demo
  labels:
    app.kubernetes.io/part-of: k8-lab
spec:
  limits:
    - type: Container

      # Applied as the container's limits when none are declared.
      default:
        cpu: 250m
        memory: 128Mi

      # Applied as the container's requests when none are declared.
      defaultRequest:
        cpu: 50m
        memory: 64Mi
